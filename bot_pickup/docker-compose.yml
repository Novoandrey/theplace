# bot + postgres + redis. Требует .env (см. .env.example) в этой же папке.
# Сервис bot: миграции на старте (entrypoint) + бот в long-polling (Dockerfile CMD).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-theplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-theplace}
      POSTGRES_DB: ${POSTGRES_DB:-theplace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-theplace} -d ${POSTGRES_DB:-theplace}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Запуск бота — из Dockerfile CMD (python -m src.bot).
    # Нужен реальный BOT_TOKEN в .env, иначе бот не подключится к Telegram.

volumes:
  pgdata:
